<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STRAVE — World</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="loading">
    <div class="logo">S</div>
    <h1>STRAVE</h1>
    <p>Entering World...</p>
    <div class="loader"></div>
  </div>

  <div id="game"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      STRAVE
    </div>

    <div class="world-status">
      <span id="clock">12:00</span>
      <span>● WORLD</span>
    </div>

    <button id="mapBtn" class="icon-btn">🗺️</button>
  </header>

  <section class="location-card glass">
    <small>YOU ARE IN</small>
    <h2 id="locationName">STRAVE World</h2>
    <p id="locationDescription">
      Explore the world and discover new places.
    </p>
    <button id="interactBtn" class="primary-btn">
      Explore
    </button>
  </section>

  <div class="hint glass">
    WASD / Arrow Keys to move · E to interact
  </div>

  <div class="mobile-controls">
    <button data-key="up">▲</button>
    <div>
      <button data-key="left">◀</button>
      <button data-key="down">▼</button>
      <button data-key="right">▶</button>
    </div>
  </div>

  <div class="actions">
    <button id="actionBtn">E</button>
    <button id="homeBtn">⌂</button>
  </div>

  <div id="toast"></div>

  <!-- WORLD MAP -->

  <div id="mapModal" class="modal hidden">

    <div class="modal-panel glass">

      <div class="modal-header">
        <div>
          <small>STRAVE WORLD</small>
          <h2>World Map</h2>
        </div>

        <button id="closeMap">×</button>
      </div>

      <div id="mapGrid" class="map-grid"></div>

    </div>

  </div>

  <!-- SOCIAL PANEL -->

  <div id="socialPanel" class="modal hidden">

    <div class="modal-panel glass">

      <div class="modal-header">

        <div>
          <small>SOCIAL LAYER</small>
          <h2 id="socialTitle">STRAVE</h2>
        </div>

        <button id="closeSocial">×</button>

      </div>

      <div class="social-content">

        <div class="social-icon">✦</div>

        <p id="socialText">
          STRAVE social features will connect to the backend.
        </p>

        <span class="backend">
          BACKEND READY
        </span>

      </div>

    </div>

  </div>

  <script type="module" src="script.js"></script>

</body>
</html>
